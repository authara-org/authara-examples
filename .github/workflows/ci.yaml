name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"

      - name: Test Go + HTMX example
        working-directory: go+htmx
        run: go test ./...

      - name: Test Go + React backend
        working-directory: go+react
        run: go test ./...

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"

      - name: Install React example dependencies
        working-directory: go+react/web
        run: npm ci

      - name: Build React example
        working-directory: go+react/web
        run: npm run build
